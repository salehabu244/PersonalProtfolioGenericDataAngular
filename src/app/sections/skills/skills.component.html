<section class="section" id="skills" aria-labelledby="skills-title">
  <div class="container">
    <app-section-head
      eyebrow="Skills"
      title="The stack I work in every day"
      lead="Grouped by layer, from the API down to the query plan."
      [center]="true"
      [headingId]="'skills-title'"
    />

    <div class="skills">
      @for (group of groups; track group.id; let i = $index) {
        <article
          class="skill-card"
          appReveal
          [style.--reveal-delay]="i * 90 + 'ms'"
          [attr.aria-labelledby]="'skill-' + group.id"
        >
          <div class="skill-card__head">
            <span class="skill-card__icon" aria-hidden="true">
              @switch (group.icon) {
                @case ('server') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="7" rx="2" />
                    <rect x="3" y="13" width="18" height="7" rx="2" />
                    <path d="M7 7.5h.01M7 16.5h.01" />
                  </svg>
                }
                @case ('layout') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <path d="M3 9h18M9 21V9" />
                  </svg>
                }
                @case ('database') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <ellipse cx="12" cy="5.5" rx="8" ry="3" />
                    <path d="M4 5.5v13c0 1.7 3.6 3 8 3s8-1.3 8-3v-13" />
                    <path d="M4 12c0 1.7 3.6 3 8 3s8-1.3 8-3" />
                  </svg>
                }
                @case ('tool') {
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14.7 6.3a4 4 0 0 1 5 5L21 21H10L3.3 14.3a4 4 0 0 1 5-5l2.4 2.4 4-4z" />
                  </svg>
                }
              }
            </span>
            <h3 class="skill-card__title" [id]="'skill-' + group.id">{{ group.title }}</h3>
            <span class="skill-card__count">{{ group.items.length }}</span>
          </div>

          <ul class="skill-card__list">
            @for (item of group.items; track item; let j = $index) {
              <li
                class="chip"
                [style.--reveal-delay]="i * 90 + j * 35 + 'ms'"
                appReveal
              >
                {{ item }}
              </li>
            }
          </ul>
        </article>
      }
    </div>
  </div>
</section>

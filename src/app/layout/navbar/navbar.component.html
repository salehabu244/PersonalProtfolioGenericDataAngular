<header class="header" [class.header--scrolled]="scrolled()" [class.header--open]="menuOpen()">
  <div class="container header__inner">
    <a class="brand" href="#top" (click)="closeMenu()">
      <span class="brand__mark">{{ profile.initials }}</span>
      <span class="brand__name">{{ profile.name }}</span>
    </a>

    <nav
      class="nav"
      [class.nav--open]="menuOpen()"
      id="primary-nav"
      aria-label="Primary"
    >
      @for (link of links; track link.id) {
        <a
          class="nav__link"
          [class.nav__link--active]="activeSection() === link.id"
          [href]="'#' + link.id"
          (click)="closeMenu()"
          [attr.aria-current]="activeSection() === link.id ? 'page' : null"
        >
          {{ link.label }}
        </a>
      }
      <a class="btn btn--primary nav__cta" href="#contact" (click)="closeMenu()">Hire me</a>
    </nav>

    <div class="header__actions">
      <button
        type="button"
        class="icon-btn theme-toggle"
        (click)="toggleTheme()"
        [attr.aria-pressed]="isDark()"
        [attr.aria-label]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
        [title]="isDark() ? 'Switch to light theme' : 'Switch to dark theme'"
      >
        <!-- Sun (shown when dark, i.e. "switch to light") -->
        @if (isDark()) {
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
            <circle cx="12" cy="12" r="4" />
            <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
          </svg>
        } @else {
          <svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
          </svg>
        }
      </button>

      <button
        type="button"
        class="icon-btn burger"
        (click)="toggleMenu()"
        [attr.aria-expanded]="menuOpen()"
        aria-controls="primary-nav"
        [attr.aria-label]="menuOpen() ? 'Close menu' : 'Open menu'"
      >
        <span class="burger__line" [class.is-open]="menuOpen()"></span>
      </button>
    </div>
  </div>
</header>
